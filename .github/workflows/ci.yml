# Required pull-request check, plus coverage and host jobs selected by path.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      code: ${{ steps.paths.outputs.code }}
      ui: ${{ steps.paths.outputs.ui }}
      host: ${{ steps.paths.outputs.host }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: paths
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: sh .github/ci/changed-paths.sh

  linux:
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/zig
        with:
          mode: restore
      - run: zig build check
      - if: needs.changes.outputs.code == 'true'
        run: zig build test
      - if: needs.changes.outputs.code == 'true'
        run: zig build c-smoke
      - if: needs.changes.outputs.code == 'true' && needs.changes.outputs.ui == 'true'
        run: zig build golden
      - if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -eu
          if [ "${#PR_TITLE}" -gt 200 ]; then
            echo "pull request title is longer than 200 bytes"
            exit 1
          fi
          printf '%s\n' "$PR_TITLE" | grep -Eq \
            '^(feat|fix|test|docs|refactor|chore|adr|build)\([a-z0-9/_-]+\): .+'
      - if: github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
        run: >
          zig build check-commits --
          ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
      - if: success() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: ./.github/actions/zig
        with:
          mode: save

  coverage:
    needs: [changes, linux]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/zig
        with:
          mode: restore
      - run: sudo apt-get update && sudo apt-get install -y libdw-dev
      - id: kcov-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/kcov
          key: kcov-v43-${{ runner.os }}-${{ runner.arch }}
      - if: steps.kcov-cache.outputs.cache-hit != 'true'
        env:
          KCOV_PREFIX: ${{ runner.temp }}/kcov
        run: sh .github/ci/install-kcov.sh
      - if: steps.kcov-cache.outputs.cache-hit != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/kcov
          key: kcov-v43-${{ runner.os }}-${{ runner.arch }}
      - run: echo "${{ runner.temp }}/kcov/bin" >> "$GITHUB_PATH"
      - run: zig build test -Dcoverage
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          directory: zig-out/coverage
          fail_ci_if_error: true

  windows:
    needs: changes
    if: >-
      needs.changes.outputs.host == 'true' ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'ci:hosts'))
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/zig
        with:
          mode: restore
      - run: zig build test
      - if: success() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: ./.github/actions/zig
        with:
          mode: save

  macos:
    needs: changes
    if: >-
      needs.changes.outputs.host == 'true' ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'ci:hosts'))
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/zig
        with:
          mode: restore
      - run: zig build test -Dtsan
      - if: success() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: ./.github/actions/zig
        with:
          mode: save

# Windows, macOS, and arm golden. Weekly on main, or immediately via the ci:hosts label.
name: Hosts

on:
  schedule:
    - cron: "0 20 * * 0"
  workflow_dispatch:
  pull_request:
    types: [labeled]

concurrency:
  group: hosts-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read

jobs:
  gate:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          set -eu
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last=$(gh run list --workflow hosts.yml --branch main --limit 20 \
            --json headSha,event,status \
            --jq '[.[] | select(.status=="completed") | select(.event=="schedule" or .event=="workflow_dispatch")][0].headSha // ""')
          if [ -n "$last" ] && [ "$last" = "$GITHUB_SHA" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  windows:
    needs: gate
    if: >-
      !cancelled() &&
      (
        (needs.gate.result == 'success' && needs.gate.outputs.run == 'true') ||
        (needs.gate.result == 'skipped' && github.event.label.name == 'ci:hosts')
      )
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/zig
        with:
          mode: restore
      - run: zig build test
      - if: success() && github.event_name != 'pull_request'
        uses: ./.github/actions/zig
        with:
          mode: save

  macos:
    needs: gate
    if: >-
      !cancelled() &&
      (
        (needs.gate.result == 'success' && needs.gate.outputs.run == 'true') ||
        (needs.gate.result == 'skipped' && github.event.label.name == 'ci:hosts')
      )
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/zig
        with:
          mode: restore
      - run: zig build test -Dtsan
      - if: success() && github.event_name != 'pull_request'
        uses: ./.github/actions/zig
        with:
          mode: save

  arm-golden:
    needs: gate
    if: >-
      !cancelled() &&
      (
        (needs.gate.result == 'success' && needs.gate.outputs.run == 'true') ||
        (needs.gate.result == 'skipped' && github.event.label.name == 'ci:hosts')
      )
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/zig
        with:
          mode: restore
      - run: zig build golden
      - if: success() && github.event_name != 'pull_request'
        uses: ./.github/actions/zig
        with:
          mode: save

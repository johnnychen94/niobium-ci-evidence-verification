# Full verify once a day, and on demand, only when this commit has not already been built.
name: Nightly

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
  pull_request:
    types: [labeled]

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  gate:
    if: github.event_name != 'pull_request' || github.event.label.name == 'ci:verify'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          set -eu
          if [ "$EVENT" = "workflow_dispatch" ] || [ "$EVENT" = "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last=$(gh run list --workflow nightly.yml --branch main --limit 40 \
            --json headSha,event,status \
            --jq '[.[] | select(.status=="completed") | select(.event=="schedule" or .event=="workflow_dispatch")][0].headSha // ""')
          if [ -n "$last" ] && [ "$last" = "$GITHUB_SHA" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  verify:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/zig
        with:
          mode: restore
          build-cache: "false"
      - run: zig build verify --cache-poison=disallowed

  report:
    needs: [gate, verify]
    if: >-
      always() &&
      needs.gate.outputs.run == 'true' &&
      (needs.verify.result == 'success' || needs.verify.result == 'failure')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.verify.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -eu
          gh label create ci-nightly --color B60205 \
            --description "Nightly verify failed" 2>/dev/null || true
          if [ "$RESULT" = "success" ]; then
            gh issue list --label ci-nightly --state open --json number --jq '.[].number' |
              while IFS= read -r number; do
                [ -z "$number" ] && continue
                gh issue close "$number" --comment "Nightly verify succeeded: $RUN_URL"
              done
            exit 0
          fi
          open=$(gh issue list --label ci-nightly --state open --json number --jq '.[0].number')
          if [ -z "$open" ]; then
            gh issue create --label ci-nightly \
              --title "CI nightly failed" \
              --body "zig build verify failed: $RUN_URL"
          fi

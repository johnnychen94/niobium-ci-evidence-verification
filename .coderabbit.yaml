language: en
reviews:
  poem: false
  review_status: true
  high_level_summary: true
  request_changes_workflow: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main
  path_instructions:
    - path: "**"
      instructions: |
        Follow AGENTS.md. The manifest is data: do not add scripts, exec, or plugins.
        Installation is transactional and recovers only to the old or the new version.
        Zig 0.17.0. Public functions use explicit error sets. Do not add shared, common, utils, or helpers directories.
        Advisory comments only. The CI linux job is the merge gate.
